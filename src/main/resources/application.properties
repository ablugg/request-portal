spring.application.name=request-portal
server.port=8080

# PostgreSQL (Docker Compose provides the database)
spring.datasource.url=jdbc:postgresql://localhost:5432/requestportal
spring.datasource.username=portal
spring.datasource.password=portal

# Flyway manages the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Map Java camelCase fields to SQL snake_case columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
