spring.application.name=request-portal
server.port=8080

# In-memory H2 database: created on startup, gone on shutdown.
spring.datasource.url=jdbc:h2:mem:requestportal
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the tables from the @Entity classes (stage 2 moves this to migrations).
spring.jpa.hibernate.ddl-auto=create-drop
# Keep database access inside the service layer rather than open for the whole web request.
spring.jpa.open-in-view=false
